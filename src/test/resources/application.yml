# ============================================================================
# OpenCode Spring Boot Starter 完整配置示例
# ============================================================================
opencode:
  enabled: true
  http:
    server-url: http://127.0.0.1:4096
    username: opencode
    password: ${OPENCODE_SERVER_PASSWORD:}
    connect-timeout-millis: 15000
    read-timeout-millis: 300000
    verify-ssl: true
    default-model:
    default-agent: build
  cli:
    executable: opencode
    timeout: 300
    working-directory:
    max-concurrent-executions: 0
    probe-timeout-seconds: 5
    startup-check-enabled: true
    fail-fast-on-unavailable: false
